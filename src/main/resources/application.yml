spring:
  application:
    name: shine-backend

  datasource:
    url: jdbc:mysql://localhost:3307/shine?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: shine1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

logging:
  level:
    org.hibernate.SQL: debug

server:
  port: 8080

jwt:
  # 운영에서는 환경변수로 주입한다. HS256은 최소 32바이트가 필요하다.
  secret: ${JWT_SECRET:shine-local-dev-secret-key-do-not-use-in-production-2026}
  access-token-validity-ms: 1800000      # 30분
  refresh-token-validity-ms: 1209600000  # 14일
