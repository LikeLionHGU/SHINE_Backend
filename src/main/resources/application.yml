spring:
  application:
    name: shine-backend

  servlet:
    multipart:
      # 검사 결과지는 보통 2~3장, 최대 5장까지 받는다
      max-file-size: 10MB
      max-request-size: 60MB

  datasource:
    url: jdbc:mysql://localhost:3307/shine?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: shine1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

logging:
  level:
    org.hibernate.SQL: debug

server:
  port: 8080

jwt:
  # 운영에서는 환경변수로 주입한다. HS256은 최소 32바이트가 필요하다.
  secret: ${JWT_SECRET:shine-local-dev-secret-key-do-not-use-in-production-2026}
  access-token-validity-ms: ${JWT_ACCESS_TTL:86400000}   # 로컬 24시간. 운영은 환경변수로 1800000(30분)
  refresh-token-validity-ms: 1209600000  # 14일

springdoc:
  swagger-ui:
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method

app:
  storage:
    # 로컬은 프로젝트 아래, 서버는 환경변수로 /var/shine/uploads 등을 지정한다
    path: ${STORAGE_PATH:./uploads}
