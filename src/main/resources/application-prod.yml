spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/shine?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # 스키마는 SQL 파일로 관리한다. Hibernate가 운영 DB를 손대면 안 된다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TTL:1800000}
  refresh-token-validity-ms: 1209600000

app:
  storage:
    path: ${STORAGE_PATH:/app/uploads}

logging:
  level:
    root: info
    com.shine.backend: info
    org.hibernate.SQL: warn

server:
  port: 8080

# 데모 기간에는 켜둔다. 실서비스라면 꺼야 한다.
springdoc:
  swagger-ui:
    persist-authorization: true
